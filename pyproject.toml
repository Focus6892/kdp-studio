[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdp-studio"
version = "0.1.0"
description = "Toolkit for producing KDP-ready coloring books and story books: interior, cover, preflight"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pillow>=10.4",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "reportlab>=4.2",
  "pypdf>=4.3",
  "ruamel.yaml>=0.18",
  "markdown>=3.5",
  "scipy>=1.11",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
publish = ["playwright>=1.45"]
xlsx = ["openpyxl>=3.1"]
ui = ["flask>=3.0"]
local-images = ["torch", "diffusers", "transformers", "accelerate", "safetensors", "peft", "scipy"]
license = ["cryptography>=42"]
dev = ["pytest>=8"]

[project.scripts]
kdp = "kdp_studio.cli:main"

[tool.setuptools.packages.find]
include = ["kdp_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"kdp_studio.ui" = ["templates/*.html"]

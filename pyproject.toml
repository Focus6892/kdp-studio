[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdp-studio"
version = "0.1.0"
description = "Toolkit for producing KDP-ready coloring books and story books: interior, cover, preflight"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pillow>=10.4",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "reportlab>=4.2",
  "pypdf>=4.3",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
kdp = "kdp_studio.cli:main"

[tool.setuptools.packages.find]
include = ["kdp_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

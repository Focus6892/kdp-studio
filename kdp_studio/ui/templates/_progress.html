{% from "_icons.html" import icon %}<div class="card" id="progress-card"><h2>{{ icon('loader') }} Tiến trình tạo ruột</h2>
<div class="progress"><div id="bar"></div></div>
<p id="progress-text" class="muted">đang đọc…</p>
<div class="shots" id="thumbs"></div>
<p id="progress-links"></p>
</div>
<script>
async function poll(){
  try {
    const r = await fetch('{{ url_for("progress", idx=idx) }}'); const d = await r.json();
    const pct = d.total ? Math.min(100, Math.round(100 * d.done / d.total)) : 0;
    document.getElementById('bar').style.width = pct + '%';
    document.getElementById('progress-text').textContent =
      (d.total ? d.done + ' / ' + d.total + ' trang' : d.done + ' trang') + ' · ' + d.retries + ' lần sinh lại' +
      (d.seconds_per_page ? ' · ~' + d.seconds_per_page + ' giây/trang' : '') + (d.updated ? ' · trang mới nhất ' + d.updated : '') +
      (d.finished ? ' · ĐÃ XONG' : '');
    document.getElementById('thumbs').innerHTML = d.thumbs.map(u => '<a href="' + u + '" target="_blank"><img src="' + u + '" style="max-width:140px"></a>').join('');
    document.getElementById('progress-links').innerHTML = (d.pdf ? '<a class="btn small" href="' + d.pdf + '" target="_blank">interior.pdf</a> ' : '') + (d.cover ? '<a class="btn small secondary" href="' + d.cover + '" target="_blank">cover_wrap.pdf</a>' : '');
    if (!d.finished) setTimeout(poll, 4000);
  } catch (e) { document.getElementById('progress-text').textContent = 'mất kết nối với server (' + e.message + '), thử lại sau 5 giây…'; setTimeout(poll, 5000); }
}  // a server restart must not freeze this box: keep polling until it answers again
poll();
</script>

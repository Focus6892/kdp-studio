# Single source of truth for one title. Run:  python -m kdp_studio build examples/bold-easy-flowers/book.yaml
id: cb-bold-easy-flowers-001
type: coloring
niche: "bold and easy flowers coloring book for adults and seniors"
formats: [paperback]

metadata:
  title: "Bold & Easy Flowers"
  subtitle: "Large Print Coloring Book for Adults and Seniors with 30 Simple Floral Designs"
  author: "Mia Hartwell"
  language: English
  low_content: false          # KDP: coloring books are NOT low-content
  description_html: |
    <h4>Relax with 30 bold, easy flower designs</h4>
    <p>Thick outlines, large shapes and plenty of white space make every page a calm, confident coloring session, whether you are a beginner, a senior or simply want to unwind after a long day.</p>
    <ul>
      <li>30 single-sided designs so markers never bleed through</li>
      <li>Large 8.5 x 11 inch pages with wide margins</li>
      <li>Bold lines designed for low vision and tired eyes</li>
      <li>Test page to try your pencils and markers</li>
    </ul>
    <p>Pick up your favorite colors and let the garden bloom.</p>
  keywords:
    - "large print coloring book"
    - "easy coloring book adults"
    - "flower coloring book seniors"
    - "bold line coloring pages"
    - "relaxing coloring book women"
    - "simple designs beginners"
    - "stress relief coloring"
  categories:
    - "Crafts, Hobbies & Home > Crafts & Hobbies > Coloring Books for Grown-Ups"
    - "Self-Help > Stress Management"
    - "Arts & Photography > Drawing > Coloring Books"

print:
  trim: 8.5x11
  paper: white_bw
  bleed: true
  cover_finish: matte
  isbn: kdp_free

interior:
  type: coloring
  theme: "bold and easy flowers"
  # One concrete subject per page (30). Written for the free local model; the vector drawings in drawings/ are an alternative source.
  subjects:
    - "a single large daisy flower with twelve wide petals, two leaves on the stem"
    - "three tulips in a simple round pot"
    - "a big sunflower head facing forward, a few large leaves"
    - "a simple rose bloom seen from above, thick outlines"
    - "a lotus flower floating on two round lily pads"
    - "a tulip with two long leaves in a tall vase"
    - "a bunch of five daisies tied with a ribbon"
    - "a hibiscus flower with a long stamen and three leaves"
    - "a cherry blossom branch with six large blossoms"
    - "a poppy flower with four big petals and a round seed pod"
    - "a watering can with three flowers growing out of the spout"
    - "a flower wreath made of eight simple blossoms and leaves"
    - "a potted cactus with one big blooming flower on top"
    - "a lily with six pointed petals and curled tips"
    - "a basket holding four large round flowers"
    - "a heart shape filled with five simple flowers"
    - "a bluebell stem with five hanging bell flowers"
    - "a dandelion puff with a few seeds floating away"
    - "a butterfly resting on a single large flower"
    - "a bee hovering over a big open daisy"
    - "a garden row of four flowers of different heights"
    - "a flower in a teacup on a saucer"
    - "a morning glory vine with three trumpet flowers"
    - "a peony bloom with layered wide petals"
    - "a tulip bouquet wrapped in paper with a bow"
    - "a sunflower in a tall glass jar"
    - "a pansy with five large rounded petals and a dark round centre"
    - "a wildflower meadow strip with six simple flowers and tall grass"
    - "a magnolia branch with three big open flowers"
    - "a mandala made of six large petals around a circle, bold and simple"
  style_prompt: "coloring book page, bold clean black outlines, simple shapes, large areas to color, no shading, no gray, pure white background, no text, no watermark, centered composition"
  negative_prompt: "color, shading, gradients, gray fill, text, letters, numbers, watermark, signature, blurry, photo, person, woman, man, face, portrait, child, animal except the named one, tiny details, cross-hatching"
  audience: "adults and seniors, beginners, low vision"
  images: 30
  single_sided: true
  back_page: blank
  front_matter: [title, copyright, belongs_to, test_colors]
  back_matter: [thank_you, blank]
  source:
    provider: cloudflare       # free Workers AI FLUX schnell: ~2 s/page, 3/3 pages passed QA on 2026-10-24 (needs CF_ACCOUNT_ID + CF_API_TOKEN in .env)
    # Free alternative on your own GPU (about 70 s/page, LoRA tends to add people -> the OWLv2 filter rejects them):
    #   provider: local
    #   model: Lykon/dreamshaper-8
    #   lora: "artificialguybr/coloringbook-redmond-1-5v-coloring-book-lora-for-liberteredmond-sd-1-5:ColoringBookRedmond15V-LiberteRedmond-ColoringBookAF.safetensors"
    #   lora_scale: 0.8          # its trigger word ColoringBookAF then belongs at the front of style_prompt
    #   steps: 22
    #   local_size: 512x768
    seed: 7
    size: 1024x1536
  cleanup:
    threshold: 128
    min_line_px: 3
    despeckle: 1
    art_margin_in: 0.5
  dedupe:
    enabled: true
    max_distance: 10
    library: library/image_hashes.json
  qa:
    heuristic: true
    claude: false              # set true + ANTHROPIC_API_KEY for vision review
  prompts_with_claude: false   # set true + ANTHROPIC_API_KEY for varied subjects


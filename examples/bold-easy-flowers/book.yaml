  back_blurb: "Thirty bold flower designs with thick, forgiving outlines and large shapes. Each illustration sits on its own page with a blank back, so pencils, gel pens and markers all stay where you put them. Made for relaxed afternoons, shaky hands and anyone who wants a garden that always blooms."
  back_bullets:

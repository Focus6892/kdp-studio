premise: "In the river town of Alder Bend, a blue mailbox on Lantern Lane has quietly delivered letters to people who need them for forty years. When the new postmistress tries to retire it, the town's small kindnesses surface one letter at a time."
title_hint: "The Lantern Lane Letters"
genre: "cozy small-town fiction"

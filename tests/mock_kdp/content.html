<!doctype html>
<html><head><meta charset="utf-8"><title>Mock KDP – Paperback Content</title>
<script>
function collect(prefix) {
  const p = new URLSearchParams(location.search);
  document.querySelectorAll('input, select, textarea').forEach(el => {
    if (!el.id) return;
    if (el.type === 'radio' || el.type === 'checkbox') { if (el.checked) p.set(prefix + el.id, el.value || 'on'); }
    else if (el.type === 'file') { if (el.files && el.files.length) p.set(prefix + el.id, el.files[0].name); }
    else p.set(prefix + el.id, el.value);
  });
  return p.toString();
}
function freeIsbn() { document.getElementById('isbn-confirm-box').style.display = 'block'; }
function confirmIsbn() { document.getElementById('isbn-value').textContent = '979-8-0000-0000-0'; document.getElementById('isbn-assigned').value = 'free'; }
</script></head>
<body>
<h1>Paperback Content (mock)</h1>
<fieldset><legend>AI-generated content</legend>
  <label><input type="radio" name="data[print_book][ai_content]-radio" id="mock-ai-yes" value="true"> Yes</label>
  <label><input type="radio" name="data[print_book][ai_content]-radio" id="mock-ai-no" value="false"> No</label><br>
  Text <select id="mock-ai-text" name="data[print_book][ai_content][text]"><option value="none">None</option><option value="some-min">Some sections, with minimal or no editing</option><option value="entire-min">Entire work, with minimal or no editing</option><option value="entire-ext">Entire work, with extensive editing</option></select>
  Images <select id="mock-ai-images" name="data[print_book][ai_content][images]"><option value="none">None</option><option value="some-min">One or a few, with minimal or no editing</option><option value="entire-min">Many or all, with minimal or no editing</option></select>
  Translation <select id="mock-ai-translation" name="data[print_book][ai_content][translation]"><option value="none">None</option><option value="entire-min">Entire work, with minimal or no editing</option></select>
</fieldset>
<fieldset><legend>ISBN</legend>
  <button id="free-print-isbn-btn-announce" onclick="freeIsbn()">Assign me a free KDP ISBN</button>
  <div id="isbn-confirm-box" style="display:none"><button id="print-isbn-confirm-button-announce" onclick="confirmIsbn()">Assign ISBN</button></div>
  <span id="isbn-value"></span><input type="hidden" id="isbn-assigned" value="">
</fieldset>
<fieldset><legend>Print options</legend>
  <label><input type="radio" name="paper" id="data-print-book-paper-type-black-and-white-white" value="bw-white"> Black & white interior with white paper</label>
  <label><input type="radio" name="paper" id="data-print-book-paper-type-black-and-white-cream" value="bw-cream"> Black & white interior with cream paper</label>
  <label><input type="radio" name="paper" id="data-print-book-paper-type-premium-color-white" value="premium"> Premium color</label><br>
  <select id="data-print-book-trim-size"><option value="">Choose</option><option value="5x8">5 x 8 in (12.7 x 20.32 cm)</option><option value="6x9">6 x 9 in (15.24 x 22.86 cm)</option><option value="8.5x11">8.5 x 11 in (21.59 x 27.94 cm)</option></select><br>
  <label><input type="radio" name="bleed" id="data-print-book-bleed-no" value="false"> No Bleed</label>
  <label><input type="radio" name="bleed" id="data-print-book-bleed-yes" value="true"> Bleed (PDF only)</label><br>
  <label><input type="radio" name="finish" id="data-print-book-cover-finish-matte" value="matte"> Matte</label>
  <label><input type="radio" name="finish" id="data-print-book-cover-finish-glossy" value="glossy"> Glossy</label>
</fieldset>
<fieldset><legend>Manuscript</legend>
  <input type="file" id="data-print-book-publisher-interior-file-upload" name="interior">
</fieldset>
<fieldset><legend>Book Cover</legend>
  <button id="data-print-book-publisher-cover-choice-accordion" onclick="document.getElementById('cover-box').style.display='block'">Upload a cover you already have</button>
  <div id="cover-box" style="display:none"><input type="file" id="data-print-book-publisher-cover-file-upload" name="cover"></div>
</fieldset>
<button id="print-previewer-button-announce" onclick="document.getElementById('previewed').value='yes'">Launch Previewer</button>
<input type="hidden" id="previewed" value="">
<br>
<button id="save-and-continue-announce" onclick="location.href='pricing.html?' + collect('c.')">Save and Continue</button>
</body></html>
